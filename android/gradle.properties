# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Suppress deprecated API warnings from Gradle 9.x (RN Gradle Plugin compatibility shim)
org.gradle.warning.mode=none

# Enable configuration cache for faster incremental builds
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true

# Build architectures (use only arm64-v8a for emulator speed, add others for release)
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# New Architecture (Fabric + TurboModules)
newArchEnabled=true

# Hermes JS engine
hermesEnabled=true

# Edge-to-edge display
edgeToEdgeEnabled=true

# AGP 9 opt-outs (required until AGP 10 migration is complete)
android.builtInKotlin=false
android.newDsl=false
